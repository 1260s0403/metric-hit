name: Stabilize landing load

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make content independent from JS
        run: |
          sed -i 's/\.reveal{opacity:0;transform:translateY(18px);transition:opacity \.55s ease,transform \.55s ease}\.reveal\.visible{opacity:1;transform:none}/.reveal{opacity:1;transform:none;transition:none}.reveal.visible{opacity:1;transform:none}/' index.html
          sed -i 's/ loading="lazy"//g' index.html

      - name: Check landing
        run: |
          grep -q 'id="calculator"' index.html
          grep -q 'data-amount="250000"' index.html
          ! grep -q 'loading="lazy"' index.html
          ! grep -q '.reveal{opacity:0' index.html

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Стабилизировать загрузку лендинга"
          git push origin HEAD:main
